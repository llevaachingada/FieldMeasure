name: Deploy to GitHub Pages

# Builds the app under the repo's own Pages path (FM_BASE, D34; D164 reads it from
# configure-pages, so a renamed repo, a copy under another owner, or a custom domain
# just works) and publishes dist/.
# Repo settings needed once: Settings > Pages > Source = "GitHub Actions", and under
# Settings > Environments > github-pages, allow the branch being deployed.
on:
  push:
    branches: [main, beta-readiness-wave-2]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build for Pages
        run: npm run build
        env:
          # base_path is '/<repo>' for a project site, '' for a user site or a custom domain.
          FM_BASE: ${{ steps.pages.outputs.base_path }}/
          FM_BUILD_ID: ${{ github.ref_name }}+${{ github.sha }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
