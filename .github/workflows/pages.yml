name: Deploy to GitHub Pages

# Builds the app under the /FieldMeasure/ sub-path (FM_BASE, D34) and publishes dist/.
# Repo settings needed once: Settings > Pages > Source = "GitHub Actions", and under
# Settings > Environments > github-pages, allow the branch being deployed.
on:
  push:
    branches: [main, beta-readiness-wave-2]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Build for Pages
        run: npm run build
        env:
          FM_BASE: /FieldMeasure/
          FM_BUILD_ID: ${{ github.ref_name }}+${{ github.sha }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
